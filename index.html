<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guerreiro de Fé</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      overflow: hidden;

      background:
        radial-gradient(circle at 50% 30%, rgba(120, 120, 120, 0.16), transparent 35%),
        radial-gradient(circle at 50% 100%, rgba(255, 180, 50, 0.10), transparent 40%),
        linear-gradient(135deg, #020202 0%, #101010 45%, #020202 100%);

      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* LUZ DE FUNDO */
    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.08),
        transparent 70%
      );
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      animation: pulsar 5s infinite alternate;
    }

    @keyframes pulsar {
      from {
        opacity: 0.4;
        transform: translateX(-50%) scale(0.9);
      }

      to {
        opacity: 0.8;
        transform: translateX(-50%) scale(1.15);
      }
    }

    /* PARTÍCULAS */
    .particula {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: subir 8s infinite linear;
    }

    .p1 { left: 10%; animation-delay: 1s; }
    .p2 { left: 25%; animation-delay: 4s; }
    .p3 { left: 40%; animation-delay: 2s; }
    .p4 { left: 60%; animation-delay: 6s; }
    .p5 { left: 75%; animation-delay: 3s; }
    .p6 { left: 90%; animation-delay: 5s; }

    @keyframes subir {
      0% {
        bottom: -10px;
        opacity: 0;
      }

      20% {
        opacity: 0.7;
      }

      80% {
        opacity: 0.4;
      }

      100% {
        bottom: 110%;
        opacity: 0;
      }
    }

    /* CONTEÚDO */
    .container {
      position: relative;
      z-index: 2;
      width: 94%;
      max-width: 1100px;
      text-align: center;
    }

    .simbolo {
      font-size: 55px;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 15px rgba(255,255,255,0.35));
      animation: flutuar 3s ease-in-out infinite;
    }

    @keyframes flutuar {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .titulo {
      font-size: clamp(42px, 9vw, 100px);
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;

      text-shadow:
        0 0 10px rgba(255,255,255,0.25),
        0 0 30px rgba(255,255,255,0.10);

      animation: brilho 4s ease-in-out infinite;
    }

    @keyframes brilho {
      0%, 100% {
        text-shadow:
          0 0 10px rgba(255,255,255,0.20),
          0 0 30px rgba(255,255,255,0.08);
      }

      50% {
        text-shadow:
          0 0 15px rgba(255,255,255,0.40),
          0 0 45px rgba(255,255,255,0.15);
      }
    }

    .linha {
      width: 180px;
      height: 2px;
      margin: 15px auto 20px;

      background: linear-gradient(
        90deg,
        transparent,
        #ffffff,
        transparent
      );
    }

    .subtitulo {
      font-size: clamp(16px, 3vw, 25px);
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.85;
      margin-bottom: 35px;
    }

    /* CONTADOR */
    .contador {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .bloco {
      position: relative;
      padding: 24px 10px;

      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;

      box-shadow:
        inset 0 0 20px rgba(255,255,255,0.02),
        0 10px 35px rgba(0,0,0,0.35);

      backdrop-filter: blur(8px);
    }

    .numero {
      font-size: clamp(42px, 8vw, 78px);
      font-weight: 900;
      line-height: 1;

      text-shadow:
        0 0 15px rgba(255,255,255,0.25);
    }

    .label {
      margin-top: 12px;
      font-size: clamp(11px, 2vw, 16px);
      text-transform: uppercase;
      letter-spacing: 3px;
      opacity: 0.65;
    }

    /* DATA */
    .data {
      margin-top: 35px;
      font-size: clamp(15px, 3vw, 22px);
      letter-spacing: 2px;
      opacity: 0.9;
    }

    /* VERSÍCULO */
    .versiculo {
      margin: 35px auto 0;
      max-width: 750px;
      font-size: clamp(16px, 3vw, 23px);
      font-style: italic;
      line-height: 1.5;
      opacity: 0.88;
    }

    .referencia {
      display: block;
      margin-top: 8px;
      font-size: 14px;
      font-style: normal;
      letter-spacing: 2px;
      opacity: 0.65;
    }

    /* MENSAGEM FINAL */
    .finalizado {
      font-size: clamp(32px, 8vw, 75px);
      font-weight: 900;
      text-transform: uppercase;
      animation: brilho 2s infinite;
    }

    /* CELULAR */
    @media (max-width: 650px) {

      body {
        overflow-y: auto;
      }

      .container {
        padding: 30px 5px;
      }

      .simbolo {
        font-size: 42px;
      }

      .titulo {
        letter-spacing: 3px;
      }

      .subtitulo {
        margin-bottom: 25px;
        letter-spacing: 2px;
      }

      .contador {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .bloco {
        padding: 20px 8px;
      }

      .data {
        margin-top: 25px;
      }

      .versiculo {
        margin-top: 25px;
      }
    }

    @media (max-height: 650px) {
      .container {
        transform: scale(0.82);
      }
    }
  </style>
</head>

<body>

  <!-- PARTÍCULAS -->
  <div class="particula p1"></div>
  <div class="particula p2"></div>
  <div class="particula p3"></div>
  <div class="particula p4"></div>
  <div class="particula p5"></div>
  <div class="particula p6"></div>

  <!-- CONTEÚDO -->
  <main class="container">

    <div class="simbolo">⚔️</div>

    <h1 class="titulo">
      Guerreiro de Fé
    </h1>

    <div class="linha"></div>

    <div class="subtitulo">
      Uma geração preparada para a batalha
    </div>

    <!-- CONTADOR -->
    <div id="contador" class="contador">

      <div class="bloco">
        <div id="dias" class="numero">00</div>
        <div class="label">Dias</div>
      </div>

      <div class="bloco">
        <div id="horas" class="numero">00</div>
        <div class="label">Horas</div>
      </div>

      <div class="bloco">
        <div id="minutos" class="numero">00</div>
        <div class="label">Minutos</div>
      </div>

      <div class="bloco">
        <div id="segundos" class="numero">00</div>
        <div class="label">Segundos</div>
      </div>

    </div>

    <div class="data">
      24 DE OUTUBRO DE 2026 • 19:30
    </div>

    <div class="versiculo">
      “Sê forte e corajoso; não temas, nem te espantes.”
      <span class="referencia">
        Josué 1:9
      </span>
    </div>

  </main>

  <script>

    /*
      EVENTO:
      24 DE OUTUBRO DE 2026
      ÀS 19:30
      HORÁRIO DE BRASÍLIA
    */

    const dataEvento =
      new Date("2026-10-24T19:30:00-03:00").getTime();


    function atualizarContador() {

      const agora = new Date().getTime();

      const diferenca = dataEvento - agora;


      /* QUANDO O EVENTO CHEGAR */

      if (diferenca <= 0) {

        document.getElementById("contador").innerHTML =
          '<div class="finalizado">⚔️ O MOMENTO CHEGOU! ⚔️</div>';

        document.querySelector(".subtitulo").textContent =
          "Guerreiro de Fé";

        return;
      }


      /* CALCULANDO TEMPO */

      const dias =
        Math.floor(
          diferenca /
          (1000 * 60 * 60 * 24)
        );


      const horas =
        Math.floor(
          (diferenca %
          (1000 * 60 * 60 * 24)) /
          (1000 * 60 * 60)
        );


      const minutos =
        Math.floor(
          (diferenca %
          (1000 * 60 * 60)) /
          (1000 * 60)
        );


      const segundos =
        Math.floor(
          (diferenca %
          (1000 * 60)) /
          1000
        );


      /* ATUALIZANDO A TELA */

      document.getElementById("dias").textContent =
        String(dias).padStart(2, "0");

      document.getElementById("horas").textContent =
        String(horas).padStart(2, "0");

      document.getElementById("minutos").textContent =
        String(minutos).padStart(2, "0");

      document.getElementById("segundos").textContent =
        String(segundos).padStart(2, "0");

    }


    /* INICIA O CONTADOR */

    atualizarContador();


    /* ATUALIZA A CADA SEGUNDO */

    setInterval(
      atualizarContador,
      1000
    );

  </script>

</body>
</html>
